[package]
name = "onym-discovery"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of the Onym Discovery static-snapshot/Ed25519 profile"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
thiserror = "1"
anyhow = "1"
url = "2"
